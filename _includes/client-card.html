<a class="client" href="https://{{ include.domain }}/" target="_blank" rel="noopener">
  <span class="client__name">{{ include.domain }}</span>
  <p class="client__text">{{ include.description }}</p>
  <p class="client__tags">
    {% assign tags = include.tags | split: "," %}
    {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
  </p>
</a>
