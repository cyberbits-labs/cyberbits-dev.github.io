---
layout: blog
permalink: /posts/
---

<ul class="post-list">
  {%- for post in site.posts -%}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %b %Y" }}</time>
    <div>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
      <p>{{ post.content | strip_html | truncatewords: 40 }}</p>
    </div>
  </li>
  {%- endfor -%}
</ul>
